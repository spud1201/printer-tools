<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client Supplies</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column. Quote details, add-a-printer search, one card per printer line with its toner and drum, totals, then plain-text quote to copy. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#121927; --muted:#566275; --line:#D8DEE8; --track:#E4E9F1;
  --a:#2A59D6; --a-ink:#2A59D6; --on-a:#FFFFFF; --warn-bg:#FFF1DD; --warn-ink:#8A4B00; --ok-ink:#17703A; --danger:#B3261E;
  --font-display:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D121B; --surface:#151C28; --ink:#E9EDF4; --muted:#9AA6B8; --line:#263142; --track:#222C3B;
    --a:#6F98FF; --a-ink:#8CAEFF; --on-a:#0D121B; --warn-bg:#3A2A10; --warn-ink:#F5C57A; --ok-ink:#6FD39A; --danger:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D121B; --surface:#151C28; --ink:#E9EDF4; --muted:#9AA6B8; --line:#263142; --track:#222C3B;
  --a:#6F98FF; --a-ink:#8CAEFF; --on-a:#0D121B; --warn-bg:#3A2A10; --warn-ink:#F5C57A; --ok-ink:#6FD39A; --danger:#FF8A80; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-display);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:46rem;margin:0 auto;display:grid;gap:14px}
h1{margin:0;font-size:1.5rem;line-height:1.1;font-weight:800;font-stretch:112%;letter-spacing:-.01em}
h2{margin:0;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sub{margin:.35rem 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px;min-width:0}
.grid{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.full{grid-column:1/-1}
label{display:grid;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600;min-width:0}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--ink);font-size:16px}
input.num{font-family:var(--font-data);text-align:right}
textarea{resize:vertical;font-family:var(--font-data);font-size:.82rem;line-height:1.5;min-height:15rem}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;font-weight:600;font-size:.9rem}
button.primary{background:var(--a);color:var(--on-a);border-color:var(--a)}
button.link{border:0;background:none;padding:4px 0;color:var(--a-ink);font-size:.85rem}
button.del{border:0;background:none;color:var(--muted);padding:4px 8px;font-size:1.2rem;line-height:1}
.add{display:grid;gap:8px;grid-template-columns:minmax(0,1fr) auto}
.line{display:grid;gap:10px}
.line-head{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.line-head h3{margin:0;font-size:1.05rem;line-height:1.2;font-weight:700;min-width:0;overflow-wrap:anywhere}
.type{color:var(--muted);font-size:.85rem}
.tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 6px;background:var(--warn-bg);color:var(--warn-ink);margin-left:6px;vertical-align:middle}
.sec{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}
.sec-t{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:grid;gap:8px;grid-template-columns:minmax(0,1fr) 4.2rem 6.6rem;align-items:end}
.row.has-part{grid-template-columns:minmax(0,1fr) 4.2rem 6.6rem}
.tot{display:flex;justify-content:space-between;gap:10px;font-family:var(--font-data);font-size:.9rem}
.tot b{font-weight:500}
.line-total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;font-weight:700}
.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.sum{display:grid;gap:8px}
.sum .big{font-size:1.4rem;font-weight:800}
.hint{font-size:.8rem;color:var(--muted)}
.need{color:var(--warn-ink);font-size:.78rem;font-weight:600}
details summary{cursor:pointer;color:var(--a-ink);font-size:.82rem;font-weight:600}
details p{margin:.4rem 0 0;font-family:var(--font-data);font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.empty{text-align:center;color:var(--muted);padding:22px 8px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:30rem){.grid{grid-template-columns:minmax(0,1fr)}.row{grid-template-columns:minmax(0,1fr) 4rem 6rem}}

.printdoc{display:none}
.logobox{display:grid;gap:8px}
.logobox .lt{font-size:.8rem;color:var(--muted);font-weight:600}
.lrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lprev{min-width:0;max-width:14rem;min-height:3.5rem;display:flex;align-items:center;background:#fff;border:1px dashed var(--line);border-radius:8px;padding:6px 10px}
.lprev img{max-width:100%;max-height:4.5rem;display:block}
.lbtns{display:flex;gap:8px;flex-wrap:wrap}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding:6px 0;font-size:.9rem}
.skey{overflow-wrap:anywhere}
@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#444;--line:#999}
  body{background:#fff;color:#000;padding:0;font-size:11pt}
  .wrap{display:none!important}
  #savedcard{display:none!important}
  .printdoc{display:block!important}
  .pd h1{font-size:20pt;margin:0 0 4pt}
  .pd img.logo{display:block;max-height:22mm;max-width:60mm;margin:0 0 8pt}
  .pd .co{white-space:pre-line;margin:0 0 10pt;font-size:10pt}
  .pd .meta{display:grid;grid-template-columns:1fr 1fr;gap:2pt 16pt;margin:0 0 12pt;font-size:10pt}
  .pd table{width:100%;border-collapse:collapse;font-size:10pt}
  .pd th{text-align:left;border-bottom:1.5pt solid #000;padding:4pt 3pt;font-size:9pt;text-transform:uppercase;letter-spacing:.04em}
  .pd td{padding:3pt;border-bottom:.5pt solid #bbb;vertical-align:top}
  .pd td.n,.pd th.n{text-align:right;white-space:nowrap}
  .pd tr.pr td{font-weight:700;border-top:1pt solid #666;padding-top:7pt}
  .pd tr.sub td:first-child{padding-left:14pt}
  .pd tr{break-inside:avoid}
  .pd .totals{margin:10pt 0 0 auto;width:55%;font-size:11pt}
  .pd .totals div{display:flex;justify-content:space-between;padding:2pt 0}
  .pd .totals .gt{font-weight:700;border-top:1.5pt solid #000;margin-top:3pt;padding-top:4pt;font-size:13pt}
  .pd .fine{margin-top:14pt;font-size:8.5pt;color:#444}
  @page{margin:14mm}
}
.on{color:var(--ok-ink);font-weight:700;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase}
.sup{display:grid;grid-template-columns:3.6rem minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:.92rem}
.sup:first-of-type{border-top:0}
.sup .k{color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.sup .pn{font-family:var(--font-data);font-weight:500;overflow-wrap:anywhere}
.sup .pr{font-family:var(--font-data);text-align:right;white-space:nowrap}
.sup .yl{grid-column:2/-1;color:var(--muted);font-size:.82rem}
@media print{body{background:#fff}.noprint{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>Client Supplies</h1>
    <p class="sub">Pick a saved client to see their printers and the toner and drum each one takes.</p>
  </div>
  <section class="card noprint" aria-label="Client">
    <label>Saved client<select id="sel"><option value="">Loading...</option></select></label>
    <div class="hint" id="msg">Clients come from the quote tools. Save a quote to a client there first.</div>
  </section>
  <div id="out" class="wrap" style="gap:14px"></div>
  <section class="card noprint" id="copycard" aria-label="Copy list" hidden>
    <h2>Part list</h2>
    <textarea id="txt" readonly aria-label="Part list"></textarea>
    <div class="actions"><button id="copy" class="primary" type="button">Copy list</button><button id="print" type="button">Print</button></div>
    <div class="hint" id="cm"></div>
  </section>
</div>

(function(){

  // printers a client has on their saved quotes: model index -> total qty, plus the parts picked
  function printersFor(c){
    var map={},order=[];

      var st=c[t]; if(!st||!st.lines) return;
      st.lines.forEach(function(l){
        var p=DATA[l.key]; if(!p) return;
        var e=map[l.key]; if(!e){ e=map[l.key]={p:p,qty:0,picked:{}}; order.push(l.key); }
        if(t==='quote'||!c.quote) e.qty+=(+l.qty||1);
        (l.toners||[]).concat(l.drum?[l.drum]:[]).forEach(function(sp){ if(sp&&sp.opt!==-2&&sp.part) e.picked[sp.part]=1; });
      });
    });
    return order.map(function(k){return map[k];});
  }
  function pickedSet(e,list,sec){return e.picked;}

    h+='<section class="card"><h2>'+esc(c.name)+'</h2><div class="hint">'+ps.length+' printer model'+(ps.length>1?'s':'')+'. List prices in Canadian dollars. Eco fees not included.</div></section>';

  function fillSel(){
