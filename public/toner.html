<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toner cost per copy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#EEF2F5;--surface:#FFFFFF;--ink:#13202F;--muted:#5A6B7D;--line:#D5DDE5;
  --orig:#7A8796;--comp:#0B8A6A;--comp-ink:#FFFFFF;--track:#E3E9EE;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A26;--surface:#16263A;--ink:#EAF0F6;--muted:#9BAABA;--line:#2A3D54;
    --orig:#8A97A6;--comp:#3FD3A8;--comp-ink:#06231B;--track:#22344B;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A26;--surface:#16263A;--ink:#EAF0F6;--muted:#9BAABA;--line:#2A3D54;
  --orig:#8A97A6;--comp:#3FD3A8;--comp-ink:#06231B;--track:#22344B;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:30rem;margin:0 auto;padding:1.25rem 1rem 2rem}
h1{font-size:1.5rem;line-height:1.15;margin:0 0 .25rem;font-weight:700;letter-spacing:-.01em}
.sub{margin:0 0 1rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem;margin-bottom:1rem}
.row+.row{margin-top:1.1rem}
.row-head{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem}
.name{font-weight:600}
.detail{color:var(--muted);font-size:.9rem;margin:.1rem 0 .5rem}
.cpc{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.cpc small{font-size:.85rem;font-weight:400;color:var(--muted);letter-spacing:0;margin-left:.25rem}
.track{height:14px;border-radius:7px;background:var(--track);overflow:hidden}
.bar{height:100%;border-radius:7px;width:0;transition:width .35s ease}
.bar.o{background:var(--orig)}.bar.c{background:var(--comp)}
.save{background:var(--comp);color:var(--comp-ink);border-color:transparent}
.save .big{font-size:2.6rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.save p{margin:.35rem 0 0}.save .fine{opacity:.9;font-size:.95rem}
.save.neg{background:var(--surface);color:var(--ink);border-color:var(--line)}
h2{font-size:1rem;margin:0 0 .75rem;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.full{grid-column:1/-1}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.25rem}
input{width:100%;min-height:48px;padding:.5rem .75rem;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;font-variant-numeric:tabular-nums}
textarea{width:100%;padding:.5rem .75rem;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--comp);outline-offset:2px}
button{width:100%;min-height:52px;font:inherit;font-weight:600;border:0;border-radius:12px;background:var(--ink);color:var(--surface);cursor:pointer}
button:active{transform:scale(.99)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.25rem;margin-bottom:1rem}
.chip{flex:0 0 auto;width:auto;min-height:44px;padding:0 1rem;border-radius:22px;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.inline{display:flex;gap:.5rem;align-items:flex-end;margin-top:.9rem}
.inline>div{flex:1}
.inline button{width:auto;flex:0 0 auto;min-height:48px;padding:0 1.1rem}
.list{list-style:none;margin:.9rem 0 0;padding:0}
.list li{display:flex;gap:.5rem;border-top:1px solid var(--line);padding:.5rem 0}
.list .open{flex:1;min-width:0;text-align:left;background:transparent;color:var(--ink);min-height:48px;padding:.25rem 0;font-weight:400}
.list .open b{display:block;font-weight:600}
.list .open span{color:var(--muted);font-size:.85rem}
.list .del{width:48px;flex:0 0 48px;min-height:48px;background:transparent;color:var(--muted);border:1px solid var(--line);font-size:1.2rem}
.list .call{flex:0 0 56px;width:56px;min-height:48px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;color:var(--ink);font-size:.85rem;font-weight:600;text-decoration:none}
.empty,.note{color:var(--muted);font-size:.85rem;margin:.75rem 0 0}
.cmp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.cmp th,.cmp td{padding:.55rem 0;border-top:1px solid var(--line)}
.cmp thead th{border-top:0;color:var(--muted);font-weight:400;font-size:.85rem}
.cmp td,.cmp thead th+th{text-align:right}
.cmp th{text-align:left}.cmp tbody th{font-weight:600}
@media (prefers-reduced-motion:reduce){.bar{transition:none}button:active{transform:none}}
</style>
</head>
<body>
<main class="wrap">
  <h1 id="title">Toner cost per copy</h1>
  <p class="sub">Original vs. compatible cartridge</p>
  <div class="chips" id="chips" role="group" aria-label="Choose a printer"></div>

  <section class="card" aria-live="polite" aria-label="Cost per copy">
    <div class="row">
      <div class="row-head"><span class="name">Original toner</span><span class="cpc"><span id="oc"></span><small>per copy</small></span></div>
      <p class="detail" id="od"></p>
      <div class="track"><div class="bar o" id="ob"></div></div>
    </div>
    <div class="row">
      <div class="row-head"><span class="name">Compatible toner</span><span class="cpc"><span id="cc"></span><small>per copy</small></span></div>
      <p class="detail" id="cd"></p>
      <div class="track"><div class="bar c" id="cb"></div></div>
    </div>
  </section>

  <section class="card save" id="save" aria-live="polite">
    <div class="big" id="sbig"></div>
    <p id="sline"></p>
    <p class="fine" id="sfine"></p>
  </section>

  <section class="card">
    <h2>Adjust the numbers</h2>
    <div class="grid">
      <div><label for="op">Original price ($)</label><input id="op" type="number" inputmode="decimal" min="0" step="0.01"></div>
      <div><label for="oy">Original yield (copies)</label><input id="oy" type="number" inputmode="numeric" min="0" step="1"></div>
      <div><label for="cp">Compatible price ($)</label><input id="cp" type="number" inputmode="decimal" min="0" step="0.01"></div>
      <div><label for="cy">Compatible yield (copies)</label><input id="cy" type="number" inputmode="numeric" min="0" step="1"></div>
      <div class="full"><label for="mo">Copies per month</label><input id="mo" type="number" inputmode="numeric" min="0" step="1" value="1000"></div>
    </div>
    <div class="inline">
      <div><label for="pname">Save these prices as a printer</label><input id="pname" type="text" maxlength="40" placeholder="Printer name" autocomplete="off"></div>
      <button type="button" class="ghost" id="saveprinter">Save</button>
    </div>
    <button type="button" class="ghost" id="delp" hidden style="margin-top:.75rem">Delete this saved printer</button>
  </section>

  <section class="card">
    <h2>Clients</h2>
    <div class="grid">
      <div class="full"><label for="cname">Save this quote for a client</label><input id="cname" type="text" maxlength="60" placeholder="Client name" autocomplete="off"></div>
      <div><label for="cphone">Phone</label><input id="cphone" type="tel" maxlength="30" autocomplete="off"></div>
      <div><label for="cdate">Follow-up date</label><input id="cdate" type="date"></div>
      <div class="full"><label for="cnotes">Notes</label><textarea id="cnotes" maxlength="500" rows="3" placeholder="Anything worth remembering"></textarea></div>
    </div>
    <button type="button" class="ghost" id="saveclient" style="margin-top:.75rem">Save client</button>
    <ul class="list" id="clist"></ul>
    <p class="empty" id="cempty">No saved clients yet. Tap a client later to reload their quote.</p>
  </section>

  <section class="card" aria-label="Cost per copy for all printers">
    <h2>Cost per copy, all printers</h2>
    <table class="cmp">
      <thead><tr><th scope="col">Printer</th><th scope="col">Original</th><th scope="col">Compatible</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>

  <button type="button" id="copy">Copy summary to share</button>
  <p class="note" id="status"></p>
</main>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var usd = new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
  var usd0 = new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});
  var cpcFmt = new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:3,maximumFractionDigits:3});
  var int = new Intl.NumberFormat('en-US');
  var LS = 'tonerCardSaved';
  var printers = [
    {id:'mfc',name:'MFC-L3720',op:325,oy:3000,cp:100,cy:3000,builtin:true},
    {id:'hl',name:'HL-L2320D',op:54.95,oy:2600,cp:8.95,cy:2600,builtin:true}
  ];
  var clients = [], cur = 'mfc', summary = '', ref = null;
  var ids = ['op','oy','cp','cy','mo'];

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function num(id){ var v = parseFloat($(id).value); return isFinite(v) && v >= 0 ? v : 0; }
  function read(){ return {op:num('op'),oy:num('oy'),cp:num('cp'),cy:num('cy'),mo:num('mo')}; }
  function find(id){ for (var i = 0; i < printers.length; i++){ if (printers[i].id === id) return printers[i]; } return null; }
  function calc(v){
    var oc = v.oy > 0 ? v.op / v.oy : null, cc = v.cy > 0 ? v.cp / v.cy : null;
    var diff = (oc !== null && cc !== null) ? oc - cc : null;
    return {oc:oc, cc:cc, diff:diff, yearly: diff === null ? 0 : diff * v.mo * 12};
  }
  function fmtDate(s){
    var p = String(s).split('-');
    if (p.length !== 3) return '';
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return isNaN(d.getTime()) ? '' : d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  }
  function flash(btn, msg){
    var old = btn.textContent;
    btn.textContent = msg;
    setTimeout(function(){ btn.textContent = old; }, 1500);
  }

  /* ---------- rendering ---------- */
  function buildChips(){
    var c = $('chips'); c.textContent = '';
    printers.forEach(function(p){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = p.name;
      b.setAttribute('aria-pressed', p.id === cur ? 'true' : 'false');
      b.addEventListener('click', function(){ select(p.id); });
      c.appendChild(b);
    });
  }
  function buildTable(v){
    var tb = $('tbody'); tb.textContent = '';
    printers.forEach(function(p){
      var s = p.id === cur ? v : p, tr = document.createElement('tr'), th = document.createElement('th');
      th.scope = 'row'; th.textContent = p.name; tr.appendChild(th);
      [s.oy > 0 ? s.op / s.oy : null, s.cy > 0 ? s.cp / s.cy : null].forEach(function(x){
        var td = document.createElement('td');
        td.textContent = x === null ? '\u2014' : cpcFmt.format(x);
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
  }
  function buildClients(){
    var ul = $('clist'); ul.textContent = '';
    $('cempty').hidden = clients.length > 0;
    clients.forEach(function(c){
      var li = document.createElement('li'), open = document.createElement('button'), del = document.createElement('button');
      var b = document.createElement('b'), s = document.createElement('span'), r = calc(c);
      b.textContent = c.name;
      s.textContent = c.pname + (r.diff !== null && r.diff > 0 ? ', saves ' + usd0.format(r.yearly) + ' a year' : '') + (fmtDate(c.fdate) ? ', follow up ' + fmtDate(c.fdate) : '');
      open.type = 'button'; open.className = 'open';
      open.appendChild(b); open.appendChild(s);
      open.addEventListener('click', function(){ loadClient(c); });
      del.type = 'button'; del.className = 'del'; del.textContent = '\u00d7';
      del.setAttribute('aria-label', 'Delete ' + c.name);
      del.addEventListener('click', function(){
        clients = clients.filter(function(x){ return x.id !== c.id; });
        persist(); buildClients();
      });
      li.appendChild(open);
      var tel = String(c.phone || '').replace(/[^\d+]/g, '');
      if (tel){
        var call = document.createElement('a');
        call.className = 'call'; call.href = 'tel:' + tel; call.textContent = 'Call';
        call.setAttribute('aria-label', 'Call ' + c.name);
        li.appendChild(call);
      }
      li.appendChild(del); ul.appendChild(li);
    });
  }

  function render(){
    var v = read(), r = calc(v), P = find(cur) || printers[0];
    $('title').textContent = P.name + ' toner cost per copy';
    document.title = P.name + ' toner cost per copy';
    $('delp').hidden = !!P.builtin;
    $('oc').textContent = r.oc !== null ? cpcFmt.format(r.oc) : '\u2014';
    $('cc').textContent = r.cc !== null ? cpcFmt.format(r.cc) : '\u2014';
    $('od').textContent = usd.format(v.op) + ' for ' + int.format(v.oy) + ' copies';
    $('cd').textContent = usd.format(v.cp) + ' for ' + int.format(v.cy) + ' copies';
    var max = Math.max(r.oc || 0, r.cc || 0);
    $('ob').style.width = max > 0 ? ((r.oc || 0) / max * 100) + '%' : '0';
    $('cb').style.width = max > 0 ? ((r.cc || 0) / max * 100) + '%' : '0';
    buildTable(v);

    var box = $('save');
    if (r.diff === null){
      box.className = 'card save neg';
      $('sbig').textContent = '\u2014';
      $('sline').textContent = 'Enter a yield above zero for both cartridges.';
      $('sfine').textContent = '';
      summary = '';
      return;
    }
    var pct = r.oc > 0 ? Math.abs(r.diff) / r.oc * 100 : 0;
    if (r.diff > 0){
      box.className = 'card save';
      $('sbig').textContent = usd0.format(r.yearly);
      $('sline').textContent = 'saved per year at ' + int.format(v.mo) + ' copies a month';
      $('sfine').textContent = cpcFmt.format(r.diff) + ' less per copy, ' + Math.round(pct) + '% lower cost';
    } else if (r.diff < 0){
      box.className = 'card save neg';
      $('sbig').textContent = usd0.format(Math.abs(r.yearly));
      $('sline').textContent = 'extra per year with compatible at ' + int.format(v.mo) + ' copies a month';
      $('sfine').textContent = cpcFmt.format(Math.abs(r.diff)) + ' more per copy';
    } else {
      box.className = 'card save neg';
      $('sbig').textContent = '$0';
      $('sline').textContent = 'No difference in cost per copy';
      $('sfine').textContent = '';
    }
    var who = $('cname').value.trim();
    summary =
      (who ? 'Client: ' + who + '\n' : '') +
      P.name + ' toner cost per copy\n' +
      'Original: ' + usd.format(v.op) + ' for ' + int.format(v.oy) + ' copies = ' + cpcFmt.format(r.oc) + ' per copy\n' +
      'Compatible: ' + usd.format(v.cp) + ' for ' + int.format(v.cy) + ' copies = ' + cpcFmt.format(r.cc) + ' per copy\n' +
      'Difference: ' + cpcFmt.format(r.diff) + ' per copy (' + Math.round(pct) + '%)\n' +
      'At ' + int.format(v.mo) + ' copies a month: original ' + usd0.format(r.oc * v.mo * 12) +
      ' vs. compatible ' + usd0.format(r.cc * v.mo * 12) + ' per year';
  }

  function select(id){
    var p = find(id); if (!p) return;
    cur = id;
    ['op','oy','cp','cy'].forEach(function(k){ $(k).value = p[k]; });
    $('pname').value = p.builtin ? '' : p.name;
    buildChips(); render();
  }
  function loadClient(c){
    if (find(c.pid)) cur = c.pid;
    ids.forEach(function(k){ $(k).value = c[k]; });
    $('cname').value = c.name;
    $('cphone').value = c.phone || '';
    $('cdate').value = c.fdate || '';
    $('cnotes').value = c.notes || '';
    buildChips(); render();
  }

  /* ---------- saving ---------- */
  function snapshot(){
    return {
      printers: printers.filter(function(p){ return !p.builtin; }).map(function(p){
        return {id:p.id,name:p.name,op:p.op,oy:p.oy,cp:p.cp,cy:p.cy};
      }),
      clients: clients
    };
  }
  function persist(){
    var d = snapshot();
    try { localStorage.setItem(LS, JSON.stringify(d)); } catch (e) {}
    if (ref){
      ref.set(d).catch(function(){
        $('status').textContent = 'Couldn\u2019t sync to your account. Changes are saved on this device.';
      });
    }
  }
  function apply(d){
    printers = printers.filter(function(p){ return p.builtin; });
    clients = [];
    if (d && Array.isArray(d.printers)){
      d.printers.forEach(function(p){
        if (p && p.id && p.name) printers.push({id:String(p.id),name:String(p.name),op:+p.op||0,oy:+p.oy||0,cp:+p.cp||0,cy:+p.cy||0});
      });
    }
    if (d && Array.isArray(d.clients)){
      d.clients.forEach(function(c){
        if (c && c.id && c.name) clients.push({id:String(c.id),name:String(c.name),pid:String(c.pid||''),pname:String(c.pname||''),op:+c.op||0,oy:+c.oy||0,cp:+c.cp||0,cy:+c.cy||0,mo:+c.mo||0,phone:String(c.phone||''),fdate:String(c.fdate||'').slice(0,10),notes:String(c.notes||'')});
      });
    }
    if (!find(cur)) cur = printers[0].id;
  }
  async function connect(){
    var db = await claude.use('db'), user = await claude.use('user');
    if (!db || !user) return null;
    var id = await user.id();
    if (!id) return null;
    var r = db.collection('data/users/' + id).doc('saved');
    var snap = await r.get();
    return {ref:r, data: snap.exists ? snap.data() : null};
  }
  async function init(){
    var local = null;
    try { local = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) {}
    apply(local); buildClients(); select(cur);
    $('status').textContent = 'Saved clients and printers stay on this device.';
    try {
      if (!window.claude || !window.claude.use) return;
      var got = await Promise.race([connect(), new Promise(function(res){ setTimeout(function(){ res(null); }, 10000); })]);
      if (!got) return;
      ref = got.ref;
      if (got.data){
        apply(got.data); buildClients(); select(cur);
        try { localStorage.setItem(LS, JSON.stringify(snapshot())); } catch (e) {}
      } else if (local){
        persist();
      }
      $('status').textContent = 'Saved clients and printers sync to your account.';
    } catch (e) {}
  }

  ids.forEach(function(id){ $(id).addEventListener('input', render); });
  $('cname').addEventListener('input', render);

  $('saveprinter').addEventListener('click', function(){
    var name = $('pname').value.trim();
    if (!name){ $('pname').focus(); return; }
    var v = read(), lower = name.toLowerCase(), p = null;
    printers.forEach(function(x){ if (!x.builtin && x.name.toLowerCase() === lower) p = x; });
    if (!p){ p = {id:uid(), name:name}; printers.push(p); }
    p.op = v.op; p.oy = v.oy; p.cp = v.cp; p.cy = v.cy;
    cur = p.id; persist(); buildChips(); render(); flash($('saveprinter'), 'Saved');
  });
  $('delp').addEventListener('click', function(){
    var p = find(cur);
    if (!p || p.builtin) return;
    printers = printers.filter(function(x){ return x.id !== cur; });
    persist(); select(printers[0].id);
  });
  $('saveclient').addEventListener('click', function(){
    var name = $('cname').value.trim();
    if (!name){ $('cname').focus(); return; }
    var v = read(), P = find(cur), lower = name.toLowerCase();
    var rec = {id:uid(),name:name,pid:cur,pname:P.name,op:v.op,oy:v.oy,cp:v.cp,cy:v.cy,mo:v.mo,phone:$('cphone').value.trim(),fdate:$('cdate').value,notes:$('cnotes').value.trim()};
    var i = -1;
    clients.forEach(function(c, n){ if (c.name.toLowerCase() === lower) i = n; });
    if (i >= 0){ rec.id = clients[i].id; clients[i] = rec; } else { clients.unshift(rec); }
    persist(); buildClients(); flash($('saveclient'), 'Saved');
  });

  $('copy').addEventListener('click', function(){
    var btn = $('copy');
    if (!summary) return;
    function done(msg){
      btn.textContent = msg;
      setTimeout(function(){ btn.textContent = 'Copy summary to share'; }, 1800);
    }
    function fallback(){
      try {
        var ta = document.createElement('textarea');
        ta.value = summary; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        done(ok ? 'Copied' : 'Copy failed');
      } catch (e) { done('Copy failed'); }
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(summary).then(function(){ done('Copied'); }, fallback);
      } else { fallback(); }
    } catch (e) { fallback(); }
  });

  init();
})();
</script>
<script src="collapse.js"></script>
</body>
</html>
